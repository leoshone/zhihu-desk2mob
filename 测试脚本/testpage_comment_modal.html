<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>评论弹层复刻页</title>
<style>
  html,body{margin:0;padding:0}
  body{font:15px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f6f6}
  .wrap{max-width:694px;margin:0 auto;background:#fff;padding:16px}
  h1{font-size:20px}
  p{color:#1a1a1a}
  .bar{position:fixed;left:0;right:0;bottom:0;height:52px;background:#fff;border-top:1px solid #eee;
       display:flex;align-items:center;justify-content:space-around;z-index:50}
  .bar button{border:0;background:none;font-size:14px;color:#8590a6}
  #openBtn{position:fixed;left:12px;bottom:60px;z-index:51;padding:10px 16px;font-size:15px}
  /* 形态A：居中但高度远超视口 —— 关闭按钮被顶到视口外 */
  .Modal-wrapper{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000}
  .Modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
         width:600px;height:1200px;background:#fff}
  .Modal-closeButton{position:absolute;right:12px;top:12px;width:28px;height:28px;border:0;background:#eee;color:#333}
  .Modal-title{padding:16px;font-weight:600;border-bottom:1px solid #f0f0f0}
  .cmt{padding:12px 16px;border-bottom:1px solid #f6f6f6}
  .cmt b{color:#175199}
  /* 形态B：遮罩与内容同级同 z-index，遮罩先出现 */
  .zb-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:2000}
  .zb-modal{position:fixed;top:10%;left:5%;width:90%;height:80%;background:#fff;z-index:2000;overflow:auto}
  /* 形态C：portal 容器 fixed 铺满，内部弹层 relative，且没有可识别的关闭按钮 */
  #portal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:3000;background:rgba(0,0,0,.4)}
  .Comments-container{position:relative;width:100%;height:100%;background:#fff;overflow:auto}
  .Comments-header{position:sticky;top:0;background:#fff;padding:14px 16px;font-weight:600;border-bottom:1px solid #f0f0f0}
  .zh-close-x{position:absolute;right:14px;top:14px;width:26px;height:26px;border:0;background:#f0f0f0}
  /* 形态D：忠实复刻真实知乎专栏评论层（2026-09-03 真机抓取）
     本体 fixed 满屏、overflow:auto、本身不越界；但内容层 relative top:-620，
     把整段内容（含右上角关闭 X）顶到视口外。旧逻辑只查本体 → 提前 return，
     关闭按钮永远点不到。 */
  .r-modal-body{position:fixed;top:0;left:0;right:0;bottom:0;z-index:203;overflow-y:auto;background:rgba(0,0,0,.65)}
  .r-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);z-index:0}
  .r-content{position:relative;top:-620px;background:#fff;min-height:100%}
  .r-inner{position:relative;top:-545px}
  .r-scroll{position:relative;top:-545px;overflow-y:auto;padding:0 16px}
  .r-head{position:relative;top:-517px;display:flex;align-items:center;gap:10px;
          padding:14px 16px;font-weight:600;border-bottom:1px solid #f0f0f0;background:#fff}
  .r-x{position:absolute;right:16px;top:14px;width:28px;height:28px;border:0;background:#f0f0f0;color:#333;border-radius:50%}
</style>
</head>
<body>
<div class="wrap">
  <h1>正文标题：这是一个测试页面</h1>
  <p id="p1">正文第一段。弹层关掉之后，这段文字必须原样可见，页面不能跳走。</p>
  <p>正文第二段，用来确认返回键没有把用户送出页面。</p>
  <p>知乎的回答页在窄屏下点「评论」会浮出一个评论层，本页复刻了三种常见形态。</p>
  <div style="height:900px">撑高页面，验证滚动位置</div>
  <p id="p2">页面底部段落</p>
</div>

<button id="openBtn">💬 查看评论</button>
<div class="bar">
  <span>赞同</span><span>评论</span><span>收藏</span><span>分享</span>
</div>

<script>
var type = (location.search.match(/type=([A-Da-d])/) || [])[1] || 'A';
var open = document.getElementById('openBtn');
open.onclick = function () {
  if (document.getElementById('layerHost')) return;
  var host = document.createElement('div');
  host.id = 'layerHost';
  if (type === 'A' || type === 'a') {
    host.innerHTML =
      '<div class="Modal-wrapper"><div class="Modal">' +
        '<button class="Modal-closeButton">✕</button>' +
        '<div class="Modal-title">128 条评论</div>' +
        cmts(8) +
      '</div></div>';
  } else if (type === 'B' || type === 'b') {
    // 遮罩先插入、与弹层 z-index 相同 —— 老逻辑会挑中遮罩
    host.innerHTML =
      '<div class="zb-backdrop"></div>' +
      '<div class="zb-modal">' +
        '<button class="Modal-closeButton">✕</button>' +
        '<div class="Modal-title">128 条评论</div>' + cmts(8) +
      '</div>';
  } else if (type === 'D' || type === 'd') {
    // 真实知乎评论层：本体 fixed 满屏不越界，内容层 relative top:-620 顶出关闭按钮
    host.innerHTML =
      '<div class="r-modal-body">' +
        '<div class="r-backdrop"></div>' +
        '<div class="r-content"><div class="r-inner"><div class="r-scroll">' +
          '<div class="r-head">664 条评论' +
            '<button class="r-x" aria-label="关闭">✕</button></div>' +
          cmts(10) +
        '</div></div></div>' +
      '</div>';
  } else {
    // 知乎哈希类名，且关闭按钮不带任何 close 关键字
    host.innerHTML =
      '<div id="portal"><div class="Comments-container">' +
        '<div class="Comments-header">128 条评论' +
          '<button class="zh-close-x">✕</button></div>' + cmts(8) +
      '</div></div>';
  }
  document.body.appendChild(host);
  // 形态 A 刻意不给关闭按钮绑事件 —— 模拟「点了没反应」的真机情况
  // （React 事件没接住 / 按钮在视口外），此时脚本必须靠后两步兜底。
  if (type !== 'A' && type !== 'a') {
    var bs = host.querySelectorAll('button');
    for (var k = 0; k < bs.length; k++) {
      bs[k].onclick = function () { host.remove(); };
    }
  }
};
function cmts(n) {
  var s = '';
  for (var i = 0; i < n; i++) {
    s += '<div class="cmt"><b>用户' + i + '</b>：这条评论用来把弹层内容撑起来，模拟真实评论列表。</div>';
  }
  return s;
}
window.__layerType = type;
</script>
</body>
</html>
