<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  body{margin:0;font:15px/1.7 system-ui;background:#f6f6f6}
  .app{max-width:700px;margin:0 auto;background:#fff;min-height:200vh}
  h1{padding:18px}
  /* 关不掉的弹层：模拟 React 重渲染把 display:none 立刻改回来的真机失败模式 */
  #modal{position:fixed;left:0;top:0;width:100%;height:100%;background:#fff;z-index:1000;display:none}
  #modal.show{display:block}
  #modal .inner{padding:20px}
  #modal textarea{width:90%;height:120px}
  .bar{padding:18px}
</style></head>
<body>
<div class="app">
  <h1>专栏文章标题</h1>
  <div class="bar">
    <button id="entry">676 条评论</button>
  </div>
  <div style="height:1600px"></div>
</div>

<div id="modal">
  <div class="inner">
    <h2>评论区</h2>
    <p>这是一段评论内容，用于让 collectLayers 的文字判据命中。这是一段评论内容，用于让 collectLayers 的文字判据命中。</p>
    <textarea placeholder="写下你的评论…"></textarea>
    <div class="cmt">张三：写得很好</div>
    <div class="cmt">李四：收藏了</div>
    <!-- 关闭按钮存在但点了不关（模拟 React 不响应 + 选择器命中但无效） -->
    <button aria-label="关闭" id="fakeClose">✕</button>
  </div>
</div>

<script>
  var modal = document.getElementById('modal');
  document.getElementById('entry').addEventListener('click', function () {
    modal.classList.add('show');
  });
  // 假关闭按钮：点了什么都不做
  document.getElementById('fakeClose').addEventListener('click', function (e) {
    e.preventDefault(); e.stopPropagation();
  });
  // ★ 模拟 React：任何把 modal 设为 display:none 的尝试都立刻被改回来
  new MutationObserver(function () {
    if (getComputedStyle(modal).display === 'none') {
      modal.style.setProperty('display', 'block', 'important');
      window.__zombieRevives = (window.__zombieRevives || 0) + 1;
    }
  }).observe(modal, { attributes: true, attributeFilter: ['style'] });
</script>
</body></html>
